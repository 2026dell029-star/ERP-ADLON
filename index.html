    <script>
      (function() {
        try {
          var originalFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : undefined;
          var fetchHolder = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return fetchHolder;
            },
            set: function(newFetch) {
              fetchHolder = newFetch;
            }
          });
        } catch (e) {
          // Silently ignore if already configured
        }
      })();
    </script>
